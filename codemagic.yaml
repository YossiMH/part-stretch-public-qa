workflows:
  native_safari_public_files:
    name: Native Safari public files
    instance_type: mac_mini_m2
    max_build_duration: 5
    environment:
      xcode: "27.0"
      groups:
        - public_qa_run
    scripts:
      - name: Pure checks and current public import edit rendering
        script: |
          python3 -E -S -B - <<'PY'
          import os
          import pathlib
          import re
          import signal
          import subprocess
          import sys
          import time

          # Manual dispatch requires a separately journaled ID, a fresh actual
          # Free Personal balance >=10 minutes and billing confirmed disabled.
          # This public job cannot read or authorize the provider account.
          run_id = os.environ.get("QA_RUN_ID", "")
          if re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_-]{0,63}", run_id) is None:
              raise SystemExit("QA_RUN_ID must be set to the pre-journaled unique run ID")
          output_root = pathlib.Path(".qa-runs") / run_id
          if output_root.exists():
              raise SystemExit("Existing output identity: do not replay this run")
          deadline = time.monotonic() + 240.0

          def expire(signum: int, frame: object) -> None:
              raise TimeoutError("Combined public native script exceeded 240 seconds")

          signal.signal(signal.SIGALRM, expire)
          signal.setitimer(signal.ITIMER_REAL, 240.0)
          for module in ("qa.test_stl", "qa.test_webdriver_boundary"):
              subprocess.run((sys.executable, "-E", "-S", "-B", "-m", module),
                             stdin=subprocess.DEVNULL, check=True,
                             timeout=min(20.0, deadline - time.monotonic()))
          # Accepted unchanged F4 transport is retained externally. This limited
          # current check cannot close the historical full Safari requirements.
          for phase in ("current",):
              subprocess.run((sys.executable, "-E", "-S", "-B", "-m", "qa.native_safari", phase,
                              "--output", str(output_root / phase), "--run-id", run_id,
                              "--deadline-seconds", "55"), stdin=subprocess.DEVNULL, check=True,
                             timeout=min(60.0, deadline - time.monotonic()))
          signal.setitimer(signal.ITIMER_REAL, 0)
          PY
